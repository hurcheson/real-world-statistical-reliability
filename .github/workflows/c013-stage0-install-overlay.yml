name: Install verified C013 Stage0 overlay

on:
  push:
    branches:
      - codex/c013-stage0-provenance
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify transfer archive
        run: echo "3eda10e4587fba8b14245a7f64e507a99e3f64b99f991923c19b67e8aa4fb2e1  .c013-transfer/overlay.tar.xz" | sha256sum -c -
      - name: Install synchronized tree
        run: |
          find research/canonical -maxdepth 1 -type f -name '[0-9][0-9]-*' -delete
          rm -rf projects/c013-places-temporal-provenance
          tar -xJf .c013-transfer/overlay.tar.xz -C .
          rm -rf .c013-transfer
          find projects/c013-places-temporal-provenance -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +
      - name: Install C013 test environment
        run: python -m pip install -e "projects/c013-places-temporal-provenance[test]"
      - name: Run C013 tests
        run: python -m pytest -q projects/c013-places-temporal-provenance/tests
      - name: Validate C013 machine-readable state
        run: |
          cd projects/c013-places-temporal-provenance
          PYTHONPATH=src python scripts/validate_stage0.py
          python -m compileall -q src scripts
          sha256sum outputs/machine/preliminary_provenance_crosswalk.jsonl data/manifests/retrieval_manifest.jsonl
      - name: Clean-room rerun
        run: |
          tmp=$(mktemp -d)
          cp -a projects/c013-places-temporal-provenance "$tmp/project"
          cd "$tmp/project"
          PYTHONPATH=src python scripts/validate_stage0.py > run1.txt
          PYTHONPATH=src python scripts/validate_stage0.py > run2.txt
          cmp run1.txt run2.txt
      - name: Run legacy C011 invariant tests
        run: |
          python -m pip install -e "projects/c011-qct-precision-screen[test]"
          python -m pytest -q projects/c011-qct-precision-screen/tests/test_invariants.py
      - name: Attempt legacy C011 regression test
        continue-on-error: true
        run: python -m pytest -q projects/c011-qct-precision-screen/tests/test_2016_regression.py
      - name: Commit verified synchronized Stage0A tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: synchronize v0.28.0 and build C013 Stage0A [skip ci]"
            git push origin HEAD:codex/c013-stage0-provenance
          fi
