name: C013 Stage0 full crosswalk build

on:
  push:
    branches:
      - codex/c013-stage0-provenance
    paths:
      - projects/c013-places-temporal-provenance/scripts/build_full_crosswalk.py
      - .github/workflows/c013-stage0-build-crosswalk.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build full metadata crosswalk
        run: python projects/c013-places-temporal-provenance/scripts/build_full_crosswalk.py
      - name: Validate crosswalk records
        run: |
          cd projects/c013-places-temporal-provenance
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from c013_places.pipeline import read_jsonl
          from c013_places.core import validate_crosswalk, unique_keys
          p=Path("outputs/machine/full_provenance_crosswalk.jsonl")
          rows=read_jsonl(p)
          for r in rows: validate_crosswalk(r)
          unique_keys(rows)
          assert len(rows)==839, len(rows)
          print({"full_crosswalk_records":len(rows)})
          PY
      - name: Commit full crosswalk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/c013-places-temporal-provenance/outputs/machine/full_provenance_crosswalk.jsonl
          if git diff --cached --quiet; then
            echo "No crosswalk changes"
          else
            git commit -m "data: build full C013 metadata provenance crosswalk [skip ci]"
            git pull --rebase origin codex/c013-stage0-provenance
            git push origin HEAD:codex/c013-stage0-provenance
          fi
