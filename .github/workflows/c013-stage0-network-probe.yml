name: C013 Stage0 network probe

on:
  workflow_dispatch:
  push:
    branches:
      - codex/c013-stage0-provenance
    paths:
      - projects/c013-places-temporal-provenance/scripts/network_probe.py
      - .github/workflows/c013-stage0-network-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe frozen Socrata anchors
        run: python projects/c013-places-temporal-provenance/scripts/network_probe.py
      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: c013-stage0-network-probe
          path: projects/c013-places-temporal-provenance/outputs/machine/network_probe.json
