[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qct-reliability"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy==2.2.6", "openpyxl==3.1.5", "pandas==2.2.3", "PyYAML==6.0.2"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
